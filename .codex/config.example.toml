# Copy this file to .codex/config.toml and replace the paths with your local GoLand installation paths.

[mcp_servers.jetbrains]
command = "/path/to/goland/jbr/bin/java"
args = [
  "-classpath",
  "/path/to/goland/plugins/mcpserver/lib/mcpserver-frontend.jar:/path/to/goland/lib/util-8.jar:/path/to/goland/lib/intellij.libraries.kotlinx.coroutines.core.jar:/path/to/goland/lib/intellij.libraries.ktor.client.cio.jar:/path/to/goland/lib/intellij.libraries.ktor.client.jar:/path/to/goland/lib/intellij.libraries.ktor.network.tls.jar:/path/to/goland/lib/intellij.libraries.ktor.io.jar:/path/to/goland/lib/intellij.libraries.ktor.utils.jar:/path/to/goland/lib/intellij.libraries.kotlinx.io.jar:/path/to/goland/lib/intellij.libraries.kotlinx.serialization.core.jar:/path/to/goland/lib/intellij.libraries.kotlinx.serialization.json.jar",
  "com.intellij.mcpserver.stdio.McpStdioRunnerKt",
]

[mcp_servers.jetbrains.env]
IJ_MCP_SERVER_PORT = "64342"

# Optional: hide reusable prompt library from Codex tool reads by default.
# If enabled, Codex will not be able to read docs/prompts until this rule is removed
# or a different permissions profile is selected.
#
# default_permissions = "project-with-prompts-hidden"
#
# [permissions.project-with-prompts-hidden.filesystem.":project_roots"]
# "." = "write"
# "docs/prompts" = "none"
