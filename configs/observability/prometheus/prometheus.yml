global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: avatar-service-server
    metrics_path: /metrics
    static_configs:
      - targets:
          - server:8080

  - job_name: avatar-service-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9091

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
